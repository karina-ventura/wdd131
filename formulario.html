<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário para avaliação de produtos com classificação, comentários e recursos úteis.">
    <meta name="author" content="Karina Ventura">

    <title>Formulário de Avaliação</title>

    <link rel="stylesheet" href="estilos/formulario.css">

    <script src="scripts/formulario.js" defer></script>
</head>

<body>

    <header>
        <h1>Avaliação do Produto</h1>
    </header>

    <main>

        <form method="get" action="avaliacao.html">

            <div class="campo">

                <label for="produto">
                    Nome do Produto 
                </label>

                <select id="produto" name="produto" required>
                    <option value="" selected disabled>Selecione um Produto...</option>
                </select>

            </div>

            <div class="campo">

                <label>
                    Classificação Geral 
                </label>

               <div class="rating">

                    <label for="star1">
                        <span>&star;</span>
                        <input type="radio" id="star1" name="classificacao" value="1" required>
                    </label>

                    <label for="star2">
                        <span>&star;&star;</span>
                        <input type="radio" id="star2" name="classificacao" value="2" required>
                    </label>

                    <label for="star3">
                        <span>&star;&star;&star;</span>
                        <input type="radio" id="star3" name="classificacao" value="3" required>
                    </label>

                    <label for="star4">
                        <span>&star;&star;&star;&star;</span>
                        <input type="radio" id="star4" name="classificacao" value="4" required>
                    </label>

                    <label for="star5">
                        <span>&star;&star;&star;&star;&star;</span>
                        <input type="radio" id="star5" name="classificacao" value="5" required>
                    </label>

                </div>

            </div>

            <div class="campo">

                <label for="data">
                    Data de Instalação 
                </label>

                <input
                    type="date"
                    id="data"
                    name="data"
                    required>

            </div>

            <div class="campo">

                <label>
                    Quais recursos você achou úteis no produto?
                    <br>
                    <small>(Marque todos que se aplicam)</small>
                </label>

                <div class="features">

                    <label for="durabilidade">
                        <input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade">
                        Durabilidade
                    </label>

                    <label for="facilidade">
                        <input type="checkbox" id="facilidade" name="recursos" value="Facilidade de Uso">
                        Facilidade de Uso
                    </label>

                    <label for="desempenho">
                        <input type="checkbox" id="desempenho" name="recursos" value="Desempenho">
                        Desempenho
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="recursos" value="Design">
                        Design
                    </label>

                </div>

            </div>

            <div class="campo">

                <label for="comentario">
                    Avaliação Escrita
                    <small>(Opcional)</small>
                </label>

                <textarea
                    id="comentario"
                    name="comentario"
                    rows="6"></textarea>

            </div>

            <div class="campo">

                <label for="usuario">
                    Seu Nome
                    <small>(Opcional)</small>
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario">

            </div>

            <input
                class="botao"
                type="submit"
                value="Publicar Avaliação">

        </form>

    </main>

    <footer>

        <p>
            © <span id="ano"></span> | Karina Ventura | Brasil
        </p>

        <p id="ultima"></p>

    </footer>

</body>

</html>
